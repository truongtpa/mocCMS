# Không hardcode tên project: tên container/network lấy từ biến PROJECT do
# build.sh sinh ra (theo tên thư mục source). Service name để chung là
# app/worker vì YAML key không nhận biến.
networks:
    default:
        name: ${PROJECT:-app}_network
        driver: bridge

services:
    app:
        image: ${IMAGE:-app}:${TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                ENV_FILE: ${ENV_FILE:-.env}
        container_name: ${PROJECT:-app}_app
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: app
        ports:
            - "${APP_PORT:-3005}:8000"
        volumes:
            # mount thẳng storage/ của source: log, upload, session file nằm
            # trên host — xem trực tiếp được và sống qua các lần rebuild
            - ../storage:/var/www/html/storage

