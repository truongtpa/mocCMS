networks:
    hoso_sinhvien_network:
        driver: bridge

volumes:
    hoso_sinhvien_storage:

services:
    hoso_sinhvien_app:
        image: ${IMAGE:-hoso-sinhvien}:${TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                ENV_FILE: ${ENV_FILE:-.env}
        container_name: hoso_sinhvien_app
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: app
        ports:
            - "${APP_PORT:-3005}:8000"
        volumes:
            - hoso_sinhvien_storage:/var/www/html/storage/app
        networks:
            - hoso_sinhvien_network

    hoso_sinhvien_worker:
        image: ${IMAGE:-hoso-sinhvien}:${TAG:-latest}
        container_name: hoso_sinhvien_worker
        restart: unless-stopped
        depends_on:
            - hoso_sinhvien_app
        environment:
            CONTAINER_ROLE: worker
        volumes:
            - hoso_sinhvien_storage:/var/www/html/storage/app
        healthcheck:
            disable: true
        stop_grace_period: 650s
        networks:
            - hoso_sinhvien_network
