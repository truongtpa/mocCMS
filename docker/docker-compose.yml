networks:
    hoso_sinhvien_network:
        driver: bridge

services:
    hoso_sinhvien_nginx:
        image: nginx:alpine
        container_name: hoso_sinhvien_nginx
        restart: unless-stopped
        tty: true
        ports:
            - "3005:80"
        volumes:
            - ../:/var/www/app/
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - hoso_sinhvien_vite
            - hoso_sinhvien_php
        networks:
            - hoso_sinhvien_network

    hoso_sinhvien_php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hoso_sinhvien_php
        restart: unless-stopped
        tty: true
        working_dir: /var/www/app
        volumes:
            - ../:/var/www/app
        networks:
            - hoso_sinhvien_network

    hoso_sinhvien_vite:
        image: node:18
        container_name: hoso_sinhvien_vite
        working_dir: /var/www/app
        volumes:
            - ../:/var/www/app
        command: sh -c "npm install && npm run build"
        networks:
            - hoso_sinhvien_network

