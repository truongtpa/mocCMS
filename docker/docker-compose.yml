networks:
    default:
        name: ${PROJECT:-app}_network
        driver: bridge

services:
    app:
        image: ${IMAGE:-app}:${TAG:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                ENV_FILE: ${ENV_FILE:-.env}
        container_name: ${PROJECT:-app}_app
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: app
        ports:
            - "${APP_PORT:-3005}:8000"
        volumes:
            - ../storage:/var/www/html/storage

