[supervisord]
nodaemon=true
logfile=/var/www/app/storage/logs/supervisord.log
logfile_maxbytes=10MB
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/var/www/app/storage/logs/php-fpm-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:queue-worker]
; --max-time: worker tự thoát sau 1 giờ để supervisor khởi động lại, nhờ vậy code mới
; (routes, view, config) được nạp lại sau khi deploy mà không cần nhớ chạy queue:restart.
command=bash -c "sleep 10 && php artisan queue:work --verbose --tries=3 --timeout=600 --max-time=3600"
directory=/var/www/app
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/var/www/app/storage/logs/queue-worker-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
