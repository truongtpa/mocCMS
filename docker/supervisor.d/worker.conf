; Pod worker: queue + scheduler. Cùng image với pod web, khác CONTAINER_ROLE.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root
loglevel=warn

[program:queue-worker]
command=php /var/www/html/artisan queue:work --verbose --tries=3 --timeout=600 --max-time=3600 --sleep=3
directory=/var/www/html
user=root
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
priority=1
stopwaitsecs=610
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work --no-interaction
directory=/var/www/html
user=root
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[supervisorctl]
