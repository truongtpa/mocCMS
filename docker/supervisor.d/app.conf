; Pod web: chỉ chạy Octane/FrankenPHP. Queue & scheduler nằm ở pod worker (xem worker.conf) để scale độc lập.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root
loglevel=warn

[program:octane]
command=php /var/www/html/artisan octane:frankenphp --host=0.0.0.0 --port=8000 --workers=4 --max-requests=1000
directory=/var/www/html
user=root
autostart=true
autorestart=true
priority=1
stopwaitsecs=30
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[supervisorctl]
